*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at center,#1a1a2e,#0a0a1a);color:#fff;font-family:'Oswald',sans-serif;min-height:100vh;padding:8px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.brand{font-family:'Bebas Neue',sans-serif;color:var(--red);letter-spacing:4px;font-size:1.8em;text-shadow:0 0 16px rgba(233,69,96,.6);}
.chip{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;border:1px solid var(--navy);border-radius:8px;padding:4px 10px;font-size:1em;}
#gCode{color:var(--gold);border-color:var(--gold);}
#gGoal{color:var(--green);}
.status{font-size:.8em;letter-spacing:1px;color:var(--grey);min-height:16px;width:100%;}
.status.ok{color:var(--green);} .status.bad{color:var(--red);}
.layout{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center;}
.boardcol{display:flex;flex-direction:column;align-items:center;gap:8px;}
.side{flex:1;min-width:240px;max-width:420px;display:flex;flex-direction:column;gap:10px;}

.board{display:grid;grid-template-columns:2fr repeat(8,1fr) 2fr;grid-template-rows:2fr repeat(8,1fr) 2fr;gap:2px;width:min(94vw,560px);height:min(94vw,560px);background:var(--darker);border:2px solid var(--red);border-radius:10px;padding:2px;position:relative;}
.board-space{background:rgba(15,52,96,.65);border:1px solid rgba(255,255,255,.1);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px 1px;text-align:center;position:relative;overflow:visible;min-width:0;}
.space-icon{font-size:clamp(1.1em,2.6vmin,2em);line-height:1;}
.space-name{font-size:clamp(.55em,1.5vmin,1em);line-height:1.05;color:#f3f5fb;font-weight:700;overflow-wrap:break-word;width:100%;}
.space-players{display:flex;flex-wrap:wrap;gap:0;justify-content:center;position:absolute;bottom:0;left:0;right:0;z-index:2;}
.space-piece{font-size:clamp(.9em,2vmin,1.4em);filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));line-height:1;}
.space-piece.mine{filter:drop-shadow(0 0 4px var(--gold));}
.space-piece.pop{animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.8) translateY(-4px)}100%{transform:scale(1)}}
.board-space.corner{background:rgba(233,69,96,.3);border-color:var(--red);}
.board-space.payday{background:rgba(78,204,163,.25);border-color:var(--green);}
.board-space.good{background:rgba(78,204,163,.15);border-color:var(--green);}
.board-space.bad{background:rgba(233,69,96,.15);border-color:var(--red);}
.board-space.house{background:rgba(78,204,163,.22);border-color:#4ecca3;}
.board-space.car{background:rgba(245,166,35,.22);border-color:#f5a623;}
.board-space.realtor{background:rgba(78,204,163,.15);border-color:#4ecca3;}
.board-space.job{background:rgba(138,43,226,.25);border-color:#8a2be2;}
.board-space.jcard{background:rgba(138,43,226,.15);border-color:#8a2be2;}
.board-space.hustle{background:rgba(255,140,0,.18);border-color:#ff8c00;}
.board-space.fastfood{background:rgba(220,50,50,.22);border-color:#ff2a2a;}
.center-area{position:absolute;top:calc(16.6% + 4px);left:calc(16.6% + 4px);right:calc(16.6% + 4px);bottom:calc(16.6% + 4px);background:rgba(0,0,0,.78);border:2px solid var(--navy);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;pointer-events:none;}
.center-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.4em,5vmin,3em);color:var(--red);letter-spacing:6px;text-shadow:0 0 18px rgba(233,69,96,.7);}
.center-sub{color:var(--grey);font-size:clamp(.5em,1.4vmin,.8em);letter-spacing:2px;}

.controls{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(94vw,560px);}
.dice-area{display:flex;gap:10px;justify-content:center;font-size:2em;min-height:1.2em;}
.dice-result{color:var(--gold);font-weight:700;letter-spacing:1px;min-height:1.2em;text-align:center;}
.turn-msg{color:var(--grey);font-size:.85em;text-align:center;min-height:1.2em;}
.roll-btn{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;font-size:1.5em;padding:12px 32px;border:none;border-radius:12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--red),#b91c47);box-shadow:0 4px 18px rgba(233,69,96,.4);touch-action:manipulation;}
.roll-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
.roll-info{font-size:.78em;color:var(--grey);letter-spacing:1px;text-align:center;}

.cards{display:flex;flex-direction:column;gap:6px;}
.cards-title{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;color:var(--gold);font-size:1.1em;}
.pcard{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);border:1px solid var(--navy);border-radius:10px;padding:6px 8px;}
.pcard.me{border-color:var(--green);background:rgba(78,204,163,.1);}
.pcard.lead{box-shadow:0 0 10px rgba(245,166,35,.4);}
.pcard .rank{font-family:'Bebas Neue',sans-serif;font-size:1.2em;color:var(--gold);width:30px;text-align:center;flex-shrink:0;}
.pcard .pav{font-size:1.8em;width:34px;text-align:center;flex-shrink:0;}
.pcard .pmain{flex:1;min-width:0;}
.pname{font-weight:700;letter-spacing:.5px;}
.pname .you{color:var(--green);font-size:.7em;border:1px solid var(--green);border-radius:4px;padding:0 4px;margin-left:4px;}
.pname .off{color:var(--grey);font-size:.7em;font-style:italic;}
.pmoney{color:var(--gold);font-weight:700;font-size:1.05em;}
.pdetail{color:var(--grey);font-size:.74em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pdetail .jail{color:var(--red);font-weight:700;}
.hbar{height:5px;border-radius:3px;background:#11162b;overflow:hidden;margin-top:3px;}
.hbar i{display:block;height:100%;}
.prolls{font-family:'Bebas Neue',sans-serif;font-size:1.3em;color:var(--green);width:42px;text-align:center;flex-shrink:0;line-height:1;}
.prolls small{display:block;font-size:.4em;color:var(--grey);letter-spacing:1px;}

.logbox{background:rgba(0,0,0,.45);border:1px solid var(--navy);border-radius:10px;padding:8px;}
.logbox h3{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;color:var(--grey);font-size:.9em;margin-bottom:4px;}
#log{max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.logline{font-size:.78em;color:#cdd4e6;border-left:2px solid var(--navy);padding-left:6px;}

.overlay{position:fixed;inset:0;background:rgba(6,8,22,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000;}
.overlay.hidden{display:none;}
.co-box{width:min(420px,92vw);background:linear-gradient(160deg,#1a1a2e,#0a0a1a);border:3px solid var(--navy);border-radius:18px;padding:22px;text-align:center;}
.co-box.good{border-color:var(--green);box-shadow:0 0 40px rgba(78,204,163,.4);}
.co-box.bad{border-color:var(--red);box-shadow:0 0 40px rgba(233,69,96,.4);}
.co-icon{font-size:3.4em;line-height:1;}
.co-label{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;color:var(--gold);font-size:.95em;margin-top:4px;}
.co-title{font-size:1.5em;font-weight:700;margin:4px 0;}
.co-body{color:#ddd;font-size:.95em;line-height:1.5;white-space:pre-line;margin-bottom:14px;}
.co-btn{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:1.1em;padding:10px 28px;border:none;border-radius:10px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--navy),var(--mid));}
.win-box{width:min(460px,94vw);background:linear-gradient(160deg,#1a1a2e,#0a0a1a);border:3px solid var(--gold);border-radius:20px;padding:24px;text-align:center;box-shadow:0 0 50px rgba(245,166,35,.5);}
#winAvatar{font-size:4em;}
#winName{font-family:'Bebas Neue',sans-serif;font-size:2em;color:var(--gold);letter-spacing:3px;margin:6px 0 12px;}
.wrow{display:flex;justify-content:space-between;font-size:.95em;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.08);}
.wrow span:last-child{color:var(--green);font-weight:700;}
.win-box button{margin-top:16px;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:1.1em;padding:10px 28px;border:none;border-radius:10px;cursor:pointer;color:#1a1a2e;background:linear-gradient(135deg,var(--gold),#c47f12);}
@media(max-width:760px){
  .side{max-width:none;width:min(94vw,560px);}
  body{padding-bottom:160px;}
  .controls{position:fixed;left:0;right:0;bottom:0;width:100%;background:rgba(10,10,26,.96);padding:8px 0 12px;z-index:60;border-top:1px solid var(--navy);box-shadow:0 -6px 20px rgba(0,0,0,.5);}
  .dice-area{font-size:1.5em;min-height:1em;}
}

function renderAvatar(container, avatarStr, sizePx) {
    if (!container) return;
    if (!avatarStr) { container.textContent = '?'; return; }
    if (avatarStr.startsWith('<svg') || avatarStr.startsWith('<?xml')) {
        container.innerHTML = avatarStr;
        const svg = container.querySelector('svg');
        if (svg) { svg.setAttribute('width', sizePx); svg.setAttribute('height', Math.round(sizePx * 1.6)); svg.style.display = 'block'; svg.style.overflow = 'visible'; }

}
function adjustHappiness(p, delta) { p.happiness = Math.max(0, Math.min(10, +(p.happiness + delta).toFixed(1))); }

}

function getGridPosition(id) {
    if (id <= 9)   return { row:9, col:9-id };
    if (id <= 17)  return { row:18-id, col:0 };
    if (id === 18) return { row:0, col:0 };
    if (id <= 26)  return { row:0, col:id-18 };
    if (id === 27) return { row:0, col:9 };
    return { row:id-27, col:9 };
}

function getTier(laps) { return laps>=45?3:laps>=30?2:laps>=15?1:0; }
function getTierLabel(laps) { return laps>=45?'Senior Level (Lap 45+)':laps>=30?'Mid Level (Lap 30+)':laps>=15?'Entry Level (Lap 15+)':'Starting Out'; }
function getAvailableJobs(p) { return ALL_JOBS.filter(j => j.tier <= getTier(p.laps||0)); }

function upgradeHousing(p) {
    const nl = Math.min(HOUSING.length-1, p.housingLevel+1);
    if (nl===p.housingLevel) return p.name+' already has max housing!';
    const lapsNeeded = HOUSING[nl].lapReq||0;
    if ((p.laps||0)<lapsNeeded) return p.name+' needs Lap '+lapsNeeded+' for '+HOUSING[nl].name+'.';
    const cost = Math.max(0, HOUSING[nl].price-HOUSING[p.housingLevel].price);
    if (p.money>=cost) { p.money-=cost; p.housingLevel=nl; animateAssetIcon('apHousingIcon'); return p.name+' upgraded to '+HOUSING[nl].name+'!'; }
    return p.name+" can't afford "+HOUSING[nl].name+'. Need '+fmt(cost)+'.';
}
function carLapRequired(level) { return level>=9?45:level>=6?30:level>=3?15:0; }
function upgradeCar(p, lvls) {
    if (p.carLevel<=1) return p.name+" needs to visit a Car Dealer first!";
    const nl = Math.min(CARS.length-1, p.carLevel+lvls);
    if (nl===p.carLevel) return p.name+' already has max car!';
    const lapsNeeded = carLapRequired(nl);
    if ((p.laps||0)<lapsNeeded) return p.name+' needs Lap '+lapsNeeded+' for '+CARS[nl].name+'.';
    const cost = Math.max(0, CARS[nl].price-CARS[p.carLevel].price);
    if (p.money>=cost) { p.money-=cost; p.carLevel=nl; animateAssetIcon('apCarIcon'); return p.name+' upgraded to '+CARS[nl].name+'!'; }
    return p.name+" can't afford "+CARS[nl].name+'. Need '+fmt(cost)+'.';
}

// ============================================================
//  CHAOS Multiplayer Engine  (Phase 3)
//  Networked, parallel play on a shared board. Reuses data
//  tables from game.js (HOUSING, CARS, BOARD_SPACES, decks…).
// ============================================================
let db, auth, uid, CODE=null, MY_SLOT=null;
let players = {}, meta = {}, serverOffset = 0, boardBuilt = false, winShown = false;
const DAILY_ROLLS = 50;
const d6 = () => Math.ceil(Math.random()*6);

function path(p){ return 'games/'+CODE+'/'+p; }
function setStatus(m,k){ const el=document.getElementById('status'); if(el){ el.textContent=m; el.className='status '+(k||''); } }
function banner(m){ const el=document.getElementById('turnMsg'); if(el) el.textContent=m||''; }
function toast(m){ banner(m); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ── server time / daily budget ──────────────────────────
function serverNow(){ return Date.now() + serverOffset; }
function today(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles'}).format(new Date(serverNow())); }
function rollsLeftToday(p){ const r=p&&p.rolls; if(!r||r.date!==today()) return DAILY_ROLLS; return Math.max(0, DAILY_ROLLS - (r.used||0)); }
function msToMidnightPT(){
  const parts = new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(serverNow()));
  const get=t=>+(parts.find(p=>p.type===t).value);
  const h=get('hour')%24, m=get('minute'), s=get('second');
  return ((24-h)*3600 - m*60 - s) * 1000;
}
function countdown(){ let ms=msToMidnightPT(); const h=Math.floor(ms/3600000); const m=Math.floor((ms%3600000)/60000); return h+'h '+m+'m'; }

// ── derived ─────────────────────────────────────────────
function netWorth(p){ return (p.money||0) + (HOUSING[p.housingLevel||0]?.price||0) + (CARS[p.carLevel||0]?.price||0); }
function sortedSlots(){ return Object.keys(players).filter(k=>players[k]).sort((a,b)=> netWorth(players[b]) - netWorth(players[a]) || (players[b].money-players[a].money) || ((players[b].laps||0)-(players[a].laps||0)) ); }

// ── boot ────────────────────────────────────────────────
window.addEventListener('error', e => setStatus('Script error: '+(e.message||'?'),'bad'));
window.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search);
  CODE = (q.get('code')||'').toUpperCase();
  MY_SLOT = q.get('slot');
  if(MY_SLOT===null){ try{ const l=JSON.parse(localStorage.getItem('chaosLastGame')||'{}'); CODE=CODE||l.code; MY_SLOT=l.slot; }catch(e){} }
  if(MY_SLOT!==null) MY_SLOT = +MY_SLOT;
  document.getElementById('rollBtn').onclick = onRoll;
  document.getElementById('coBtn').onclick = dismissCard;
  if(!CODE || MY_SLOT===null){ setStatus('No game — open this from the lobby.','bad'); return; }
  if(typeof firebase==='undefined'){ setStatus('Firebase SDK did not load.','bad'); return; }
  setStatus('Connecting…');
  try{
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth(); db = firebase.database();
    db.ref('.info/serverTimeOffset').on('value', s=>{ serverOffset = s.val()||0; updateControls(); });
    auth.onAuthStateChanged(u=>{ if(u){ uid=u.uid; setStatus('Connected ✓','ok'); attach(); } });
    auth.signInAnonymously().catch(e=> setStatus('Sign-in failed: '+e.message,'bad'));
  }catch(e){ setStatus('Startup error: '+(e.message||e),'bad'); }
});

function attach(){
  db.ref(path('meta')).on('value', s=>{
    meta = s.val()||{};
    BOARD_MODE = meta.boardMode || 'normal';
    if(!boardBuilt){ buildBoard(); boardBuilt=true; }
    updateHeader();
    if(meta.status==='over' && meta.winner!=null) showWin(meta.winner);
  });
  db.ref(path('players')).on('value', s=>{ players = s.val()||{}; renderCards(); renderPieces(); updateControls(); });
  db.ref(path('lastAction')).on('value', s=>{ const a=s.val(); if(a && a.by!==MY_SLOT){ popPiece(a.by); const nm=players[a.by]?players[a.by].name:'A player'; banner(nm+' moved to '+getSpaceDisplay(BOARD_SPACES[a.to]).name); } });
  db.ref(path('log')).limitToLast(12).on('value', s=>renderLog(s.val()||{}));
}

function updateHeader(){
  document.getElementById('gCode').textContent = CODE;
  const goal = '🏆 '+fmt(meta.winGoal||0);
  document.getElementById('gGoal').textContent = goal;
  document.getElementById('gMode').textContent = BOARD_MODE==='funny'?'😂 FUNNY':BOARD_MODE==='sarcastic'?'😈 SARCASTIC':'NORMAL';
}

// ── board ───────────────────────────────────────────────
function buildBoard(){
  const board=document.getElementById('board'); board.innerHTML='';
  const center=document.createElement('div'); center.className='center-area';
  center.innerHTML='<div class="center-title">CHAOS</div><div class="center-sub" id="centerMode"></div>';
  board.appendChild(center);
  BOARD_SPACES.forEach(space=>{
    const pos=getGridPosition(space.id);
    const div=document.createElement('div');
    div.className='board-space '+space.type;
    div.style.gridColumn=(pos.col+1); div.style.gridRow=(pos.row+1);
    const disp=getSpaceDisplay(space);
    div.innerHTML='<div class="space-icon">'+disp.icon+'</div><div class="space-name">'+esc(disp.name)+'</div><div class="space-players" id="sp-'+space.id+'"></div>';
    board.appendChild(div);
  });
  const cm=document.getElementById('centerMode'); if(cm) cm.textContent = BOARD_MODE==='funny'?'FUNNY MODE':BOARD_MODE==='sarcastic'?'SARCASTIC MODE':'The Game of Life';
}
function renderPieces(){
  document.querySelectorAll('.space-players').forEach(el=>el.innerHTML='');
  Object.keys(players).forEach(k=>{ const p=players[k]; if(!p) return; const el=document.getElementById('sp-'+(p.position||0)); if(el){ const s=document.createElement('span'); s.className='space-piece'+(+k===MY_SLOT?' mine':''); s.textContent=p.avatar||'❓'; s.title=p.name; el.appendChild(s); } });
}
function popPiece(slot){ const p=players[slot]; if(!p) return; const el=document.getElementById('sp-'+(p.position||0)); if(el){ const piece=[...el.children].find(c=>c.title===p.name); if(piece){ piece.classList.remove('pop'); void piece.offsetWidth; piece.classList.add('pop'); } } }

// ── cards / leaderboard ─────────────────────────────────
function renderCards(){
  const wrap=document.getElementById('cards'); if(!wrap) return; wrap.innerHTML='';
  const order=sortedSlots();
  order.forEach((k,idx)=>{
    const p=players[k]; const rank=idx+1;
    const h=p.happiness!=null?p.happiness:5; const hc=h>=7?'#4ecca3':h>=4?'#f5a623':'#e94560';
    const left=rollsLeftToday(p);
    const card=document.createElement('div'); card.className='pcard'+(+k===MY_SLOT?' me':'')+(rank===1?' lead':'');
    card.innerHTML =
      '<div class="rank">'+(rank===1?'👑':'#'+rank)+'</div>'+
      '<div class="pav">'+(p.avatar||'❓')+'</div>'+
      '<div class="pmain">'+
        '<div class="pname">'+esc(p.name||'Player')+(+k===MY_SLOT?' <span class="you">YOU</span>':'')+(p.online?'':' <span class="off">offline</span>')+'</div>'+
        '<div class="pmoney">'+fmt(p.money||0)+'</div>'+
        '<div class="pdetail">'+(HOUSING[p.housingLevel||0].icon)+' '+HOUSING[p.housingLevel||0].name+' · '+(CARS[p.carLevel||0].icon)+' '+CARS[p.carLevel||0].name+'</div>'+
        '<div class="pdetail">💼 '+esc(p.job||'Unemployed')+' · 🔄 '+(p.laps||0)+' laps'+(p.inJail?' · <span class="jail">⛓ JAIL</span>':'')+'</div>'+
        '<div class="hbar"><i style="width:'+(h/10*100)+'%;background:'+hc+'"></i></div>'+
      '</div>'+
      '<div class="prolls">'+left+'<small>rolls</small></div>';
    wrap.appendChild(card);
  });
}

// ── controls ────────────────────────────────────────────
function updateControls(){
  const me=players[MY_SLOT]; const btn=document.getElementById('rollBtn'); const info=document.getElementById('rollInfo');
  if(!me){ if(btn){btn.disabled=true; btn.textContent='WAITING…';} if(info) info.textContent='Loading your player (slot '+MY_SLOT+')…'; return; }
  const left=rollsLeftToday(me);
  if(meta.status==='over'){ btn.disabled=true; btn.textContent='GAME OVER'; info.textContent=''; return; }
  if(left<=0){ btn.disabled=true; btn.textContent='OUT OF ROLLS'; info.textContent='Resets in '+countdown(); return; }
  btn.disabled=false;
  btn.textContent = me.inJail ? '🎲 ROLL (jail)' : '🎲 ROLL';
  info.textContent = left+' rolls left today · resets in '+countdown();
}

async function animateDice(shown){
  const d1=document.getElementById('dice1'), d2=document.getElementById('dice2');
  const F=['','1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣'];
  return new Promise(res=>{ let t=0; const iv=setInterval(()=>{ d1.textContent=F[d6()]; d2.textContent=shown.length>1?F[d6()]:'⬛'; if(++t>7){ clearInterval(iv); d1.textContent=F[shown[0]]; d2.textContent=shown.length>1?F[shown[1]]:'⬛'; res(); } },70); });
}

// ── roll ────────────────────────────────────────────────
async function onRoll(){
  const me0=players[MY_SLOT];
  if(!me0 || meta.status==='over') return;
  if(rollsLeftToday(me0)<=0){ updateControls(); return; }
  document.getElementById('rollBtn').disabled=true;
  // claim a roll (server-date enforced)
  const claim = await db.ref(path('players/'+MY_SLOT+'/rolls')).transaction(r=>{ const d=today(); r=r||{date:'',used:0}; if(r.date!==d) return {date:d,used:1}; if((r.used||0)<DAILY_ROLLS) return {date:d,used:(r.used||0)+1}; return; });
  if(!claim.committed){ banner('Out of rolls today — resets in '+countdown()); updateControls(); return; }

  const me = JSON.parse(JSON.stringify(players[MY_SLOT]));
  if(me.inJail){ return jailTurn(me); }
  const dv = rollDiceVals(me);
  await animateDice(dv.shown);
  document.getElementById('diceResult').textContent = '🎲 '+dv.steps + (dv.note?(' · '+dv.note):'');
  const mv = doMove(me, dv.steps);
  const landing = resolveLanding(me, BOARD_SPACES[mv.newPos]);
  await commitTurn(me, mv, dv, landing);
}

function rollDiceVals(me){
  const car=CARS[me.carLevel||0];
  if(car.isHoopty){ const s=d6(); if(s<=3){ const m=d6(); return {steps:m, shown:[m], note:"Hoopty wouldn't start — walked"}; } const a=d6(),b=d6(); return {steps:a+b, shown:[a,b], note:'Hoopty started!'}; }
  if((me.carLevel||0)<=1){ const s=d6(); return {steps:s, shown:[s]}; }
  const a=d6(),b=d6(); return {steps:a+b, shown:[a,b]};
}

function doMove(me, steps){
  const oldPos=me.position||0; const newPos=(oldPos+steps)%36;
  const passed=(newPos<oldPos)||(newPos===0&&oldPos!==0);
  me.position=newPos; me.laps=me.laps||0;
  let paydayDesc=null;
  if(passed){
    me.laps++;
    const bill=collectRent(me);
    let body='Passed START — Lap '+me.laps+'\nPayday: '+fmt(bill.gross);
    if(bill.rent>0) body+='\nRent: -'+fmt(bill.rent);
    if(bill.carPay>0) body+='\nCar: -'+fmt(bill.carPay);
    body+='\nNet: '+fmt(bill.net)+' | Balance: '+fmt(me.money);
    if(STORY_BEATS[me.laps]){ body+='\n\n'+STORY_BEATS[me.laps]; adjustHappiness(me,0.5); }
    paydayDesc={icon:'💰',label:'LAP '+me.laps,title:'Passed START!',body,type:'good'};
  }
  return {oldPos,newPos,passed,paydayDesc};
}

function collectRent(me){
  const gross=me.job==='Unemployed'?0:me.jobPay;
  const rent=(me.housingLevel>=2&&me.housingLevel<13)?HOUSING[me.housingLevel].rent:0;
  const carPay=(me.carLevel>=2)?CARS[me.carLevel].payment:0;
  const bills=rent+carPay; const net=gross-bills;
  me.money=(me.money||0)+gross; charge(me,bills);
  return {gross,rent,carPay,bills,net};
}
function sendToJailMP(me){
  me.position=9; me.inJail=true; me.jailTurns=0;
  me.jailReason=rnd(JAIL_REASONS);
  me.jailMaxTurns=Math.ceil(Math.random()*5);
  me.jailFine=100+Math.floor(Math.random()*6)*100;
  if(me.carLevel>0){ me.vehicleSeized=me.carLevel; me.carLevel=0; }
}

function desc(icon,label,title,body,type){ return {icon,label,title,body,type:type||''}; }

function resolveLanding(me, space){
  switch(space.type){
    case 'corner':
      if(space.id===0) return desc('🏁','START','Back at the Beginning',me.name+' landed on START.','good');
      if(space.id===9) return desc('⛓️','JAIL','Just Visiting',me.name+' is just visiting.','');
      if(space.id===18){ adjustHappiness(me,0.5); return desc('🎁','FREE DAY','Nothing Happens! +0.5 Mood',me.name+' gets a free day.','good'); }
      if(space.id===27){ sendToJailMP(me); const d=desc('🚔','GO TO JAIL','Busted!',me.name+' is going to jail!\nReason: '+me.jailReason+'\nBail: '+fmt(me.jailFine),'bad'); d.sentToJail=true; return d; }
      return desc('•','',space.name,'','');
    case 'payday': {
      if(me.job==='Unemployed'){ const rent=(me.housingLevel>=2&&me.housingLevel<13)?HOUSING[me.housingLevel].rent:0; const carPay=(me.carLevel>=2)?CARS[me.carLevel].payment:0; charge(me,rent+carPay); adjustHappiness(me,-0.5); return desc('💸','NO PAYDAY','Get a Job!','No job, no paycheck. Bills: -'+fmt(rent+carPay)+'\nBalance: '+fmt(me.money),'bad'); }
      const bill=collectRent(me); adjustHappiness(me,0.5); return desc('💰','PAYDAY',me.name+' gets paid!','Payday: '+fmt(bill.gross)+'\nNet: '+fmt(bill.net)+'\nBalance: '+fmt(me.money),'good'); }
    case 'good': {
      if(space.name==='Vacation Pay'){ if(me.job==='Unemployed'){ adjustHappiness(me,-0.5); return desc('✈️','VACATION PAY','No Job','Unemployed — no vacation pay.','bad'); } me.money+=me.jobPay; adjustHappiness(me,0.5); return desc('✈️','VACATION PAY','Time Off!','+'+fmt(me.jobPay)+' deposited.','good'); }
      const c=drawCard(getGoodCards()); const r=c.effect(me); return desc(c.icon,'GOOD CARD',c.name,r[1],r[2]||'good'); }
    case 'bad': {
      if(space.name==='TAXES'){ const assets=me.money+HOUSING[me.housingLevel].price+CARS[me.carLevel].price; const t=Math.max(1,Math.round(assets*0.10)); charge(me,t); adjustHappiness(me,-0.5); return desc('📋','TAXES','Pay 10%!','Assets '+fmt(assets)+' → tax '+fmt(t),'bad'); }
      if(space.name==='Hospital'){ const mb=scaledFine(me,500); charge(me,mb); adjustHappiness(me,-0.5); return desc('🏥','HOSPITAL','Emergency Visit','Medical bills: -'+fmt(mb),'bad'); }
      const c=drawCard(getBadCards()); const r=c.effect(me); return desc(c.icon,'BAD CARD',c.name,r[1],r[2]||'bad'); }
    case 'house': return landUpgrade(me, space, 'house');
    case 'car': return landUpgrade(me, space, 'car');
    case 'realtor': return landRealtor(me, space);
    case 'job': return landJob(me);
    case 'jcard': { const c=drawCard(JOB_CARDS); const r=c.effect(me); return desc(c.icon,'JOB CARD',c.name,r,(''+r).includes('FIRED')?'bad':'good'); }
    case 'hustle': return landHustle(me, space);
    case 'fastfood': return landFast(me, space);
    default: return desc('•','',space.name,'','');
  }
}

function landUpgrade(me, space, kind){
  const ARR = kind==='house'?HOUSING:CARS;
  const lvl = kind==='house'?me.housingLevel:me.carLevel;
  const tier = kind==='house'
    ? ({budget:{max:5},mid:{max:9},luxury:{max:13}}[space.tier||'budget'])
    : ({4:{max:4},12:{max:7},25:{max:10}}[space.id]||{max:10});
  if(lvl>=ARR.length-1) return desc(kind==='house'?'🏰':'🚀',kind.toUpperCase(),'Maxed Out',me.name+' is maxed.','good');
  const nl=lvl+1;
  if(nl>tier.max) return desc('🔒','WRONG DEALER','Out of Range',space.name+' doesn\'t carry your next upgrade.','');
  const lapsNeeded = kind==='house' ? (ARR[nl].lapReq||0) : carLapRequired(nl);
  if((me.laps||0)<lapsNeeded) return desc('🔒','LOCKED','Lap '+lapsNeeded+' Required','Need Lap '+lapsNeeded+' for '+ARR[nl].name+'.','');
  const cost=Math.max(0, ARR[nl].price-ARR[lvl].price);
  if(me.money>=cost){ me.money-=cost; if(kind==='house') me.housingLevel=nl; else me.carLevel=nl; adjustHappiness(me,0.3); return desc(ARR[nl].icon,'UPGRADE!',ARR[nl].name,me.name+' bought '+ARR[nl].name+' for '+fmt(cost)+'.','good'); }
  return desc('💸','CANT AFFORD',ARR[nl].name,'Need '+fmt(cost)+', have '+fmt(me.money)+'.','bad');
}
function landRealtor(me, space){
  const avail=HOUSING.filter((h,i)=> i>me.housingLevel && (me.laps||0)>=(h.lapReq||0) && me.money>=Math.max(0,h.price-HOUSING[me.housingLevel].price));
  if(!avail.length) return desc('🏢','REALTOR','Nothing Yet',me.name+" doesn't qualify for an upgrade.",'');
  const best=avail[avail.length-1]; const cost=Math.max(0,best.price-HOUSING[me.housingLevel].price);
  me.money-=cost; me.housingLevel=HOUSING.indexOf(best); adjustHappiness(me,0.3);
  return desc('🏢','REALTOR',best.name,me.name+' moved into '+best.name+' for '+fmt(cost)+'.','good');
}
function landJob(me){
  const avail=getAvailableJobs(me); const better=avail.filter(j=>j.pay>me.jobPay); const pool=better.length?better:avail; const offer=rnd(pool);
  if(offer.pay>me.jobPay){ me.job=offer.name; me.jobPay=offer.pay; adjustHappiness(me,0.5); return desc(offer.icon,'NEW JOB!',offer.name,me.name+' is now '+offer.name+' — payday '+fmt(offer.pay)+'.','good'); }
  return desc('💼','JOB OFFICE','No Better Offer','Best offer ('+offer.name+') isn\'t a raise. Passed.','');
}
function landHustle(me, space){
  const data=(BOARD_MODE==='funny'&&FUNNY_HUSTLE_OVERRIDES[space.name])?FUNNY_HUSTLE_OVERRIDES[space.name]:HUSTLE_DATA[space.name];
  if(!data) return desc('🛠️','HUSTLE',space.name,'Nothing happened.','');
  const all=[...data.bad,...data.good]; const pick=all[Math.floor(Math.random()*all.length)];
  if(pick.earn>0){ me.money+=pick.earn; adjustHappiness(me,0.5); } else if(pick.earn<0){ charge(me,Math.abs(pick.earn)); adjustHappiness(me,-0.5); }
  return desc(space.icon,'HUSTLE — '+space.name, pick.earn>0?'+'+fmt(pick.earn):pick.earn<0?'-'+fmt(Math.abs(pick.earn)):'Nothing', pick.msg, pick.earn>0?'good':pick.earn<0?'bad':'');
}
function landFast(me, space){
  const data=FAST_FOOD_DATA[space.name]; if(!data) return desc('🍔','FOOD',space.name,'Closed.','');
  const order=data.menu[Math.floor(Math.random()*data.menu.length)]; const sp=scaledFine(me,order.price); charge(me,sp); adjustHappiness(me,0.5);
  return desc(data.icon,space.name.toUpperCase(),order.item+' — '+fmt(sp),order.msg,'bad');
}

// ── jail turn ───────────────────────────────────────────
async function jailTurn(me){
  const a=d6(), b=d6(); await animateDice([a,b]);
  document.getElementById('diceResult').textContent='🎲 '+(a+b)+(a===b?' DOUBLES!':'');
  let landing, mv=null, dv={steps:a+b, shown:[a,b]};
  if(a===b){
    me.inJail=false; if(me.vehicleSeized>0){ me.carLevel=me.vehicleSeized; me.vehicleSeized=0; }
    mv=doMove(me, a+b);
    const after=resolveLanding(me, BOARD_SPACES[mv.newPos]);
    landing=desc('🎲','JAIL BREAK','Doubles — Free!',me.name+' rolled doubles and escaped!','good');
    return commitTurn(me, mv, dv, landing, after);
  }
  me.jailTurns=(me.jailTurns||0)+1;
  if(me.jailTurns>=me.jailMaxTurns){
    const imp=me.vehicleSeized>0?(CARS[me.vehicleSeized].impound||0):0; const tot=me.jailFine+imp;
    if(me.money>=tot){ charge(me,tot); if(me.vehicleSeized>0){ me.carLevel=me.vehicleSeized; me.vehicleSeized=0; } me.inJail=false; me.jailTurns=0; landing=desc('⛓️','RELEASED','Paid '+fmt(tot),me.name+' paid bail and walked.','bad'); }
    else { landing=desc('⛓️','STILL STUCK','Can\'t Make Bail',me.name+' can\'t afford '+fmt(tot)+' — stuck another day.','bad'); }
  } else {
    landing=desc('⛓️','STILL IN JAIL','Turn '+me.jailTurns+'/'+me.jailMaxTurns,me.name+' stays in jail.','bad');
  }
  mv={oldPos:9,newPos:9,passed:false,paydayDesc:null};
  return commitTurn(me, mv, dv, landing);
}

// ── commit (atomic write + showdown) ────────────────────
async function commitTurn(me, mv, dv, landing, extraLanding){
  let steal=null;
  await db.ref(path('players')).transaction(ps=>{
    ps=ps||{}; ps[MY_SLOT]=me;
    if(!me.inJail){
      for(const k in ps){ if(k!=String(MY_SLOT) && ps[k] && ps[k].position===me.position && (ps[k].carLevel||0)>0){
        const t=d6(), dd=d6();
        if(t>dd){ const lvl=ps[k].carLevel; me.carLevel=lvl; ps[k].carLevel=0; ps[MY_SLOT]=me; steal={win:true,vic:ps[k].name,lvl,t,d:dd}; }
        else steal={win:false,vic:ps[k].name,t,d:dd};
        break;
      } }
    }
    return ps;
  });
  await db.ref(path('lastAction')).set({by:MY_SLOT,from:mv.oldPos,to:mv.newPos,steps:dv.steps,ts:firebase.database.ServerValue.TIMESTAMP});
  db.ref(path('meta/lastActivity')).set(firebase.database.ServerValue.TIMESTAMP);
  pushLog(me.name+' rolled '+dv.steps+' → '+getSpaceDisplay(BOARD_SPACES[mv.newPos]).name);
  if(landing&&landing.title) pushLog(me.name+': '+landing.title);
  if(steal&&steal.win) pushLog('⚡ '+me.name+' jacked '+steal.vic+"'s "+CARS[steal.lvl].name+'!');

  const queue=[];
  if(mv.paydayDesc) queue.push(mv.paydayDesc);
  if(landing&&(landing.title||landing.body)) queue.push(landing);
  if(extraLanding&&(extraLanding.title||extraLanding.body)) queue.push(extraLanding);
  if(steal) queue.push(steal.win
    ? desc('⚡','SHOWDOWN','You jacked '+steal.vic+'!','Rolled '+steal.t+' vs '+steal.d+'. Took the '+CARS[steal.lvl].name+'!','good')
    : desc('🛡️','SHOWDOWN',steal.vic+' defended','Rolled '+steal.t+' vs '+steal.d+'. No steal.','bad'));
  showQueue(queue, ()=>{ updateControls(); checkWin(me); });
}

function checkWin(me){
  if((me.money||0) < (meta.winGoal||Infinity)) return;
  db.ref(path('meta')).transaction(m=>{ if(!m) return m; if(m.winner==null){ m.winner=MY_SLOT; m.status='over'; } return m; });
}

// ── card overlay queue ──────────────────────────────────
let _queue=[], _queueDone=null;
function showQueue(q, done){ _queue=q.slice(); _queueDone=done; nextCard(); }
function nextCard(){ if(!_queue.length){ const d=_queueDone; _queueDone=null; if(d) d(); return; } showCard(_queue.shift()); }
function showCard(d){
  const ov=document.getElementById('cardOv'), box=document.getElementById('coBox');
  document.getElementById('coIcon').textContent=d.icon||'•';
  document.getElementById('coLabel').textContent=d.label||'';
  document.getElementById('coTitle').textContent=d.title||'';
  document.getElementById('coBody').textContent=d.body||'';
  box.className='co-box'+(d.type==='good'?' good':d.type==='bad'?' bad':'');
  ov.classList.remove('hidden');
}
function dismissCard(){ document.getElementById('cardOv').classList.add('hidden'); nextCard(); }

// ── log ─────────────────────────────────────────────────
function pushLog(text){ db.ref(path('log')).push({ text, ts: firebase.database.ServerValue.TIMESTAMP }); }
function renderLog(obj){
  const el=document.getElementById('log'); if(!el) return;
  const items=Object.values(obj).sort((a,b)=>(a.ts||0)-(b.ts||0));
  el.innerHTML=items.map(i=>'<div class="logline">'+esc(i.text)+'</div>').join('');
  el.scrollTop=el.scrollHeight;
}

// ── win ─────────────────────────────────────────────────
function showWin(slot){
  if(winShown) return; winShown=true;
  const p=players[slot]; const ov=document.getElementById('winOv');
  document.getElementById('winAvatar').textContent=(p&&p.avatar)||'👑';
  document.getElementById('winName').textContent=((p&&p.name)||'Someone')+' WINS!';
  const order=sortedSlots();
  document.getElementById('winStats').innerHTML = order.map((k,i)=>{ const pl=players[k]; return '<div class="wrow"><span>'+(i+1)+'. '+(pl.avatar||'')+' '+esc(pl.name)+'</span><span>'+fmt(netWorth(pl))+'</span></div>'; }).join('');
  ov.classList.remove('hidden');
}
