<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAOS - The Game of Life</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- INTRO SCREEN -->
    <div id="introScreen" class="screen">
        <div class="prison-gates">
            <h1>⛓️ CHAOS ⛓️</h1>
            <p class="intro-text">You just got out of Prison...</p>
            <p class="intro-text">It is your right to do whatever you want</p>
            <p class="intro-text">But you have to follow the rules!</p>
            <p class="money-text">💰 Here is $20,000 to start a new life!</p>
            <button id="startBtn" class="btn">WALK OUT THE GATES</button>
        </div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="screen hidden">
        <h1>⚡ CHAOS ⚡</h1>
        <h2>Game Setup</h2>
        
        <div class="setup-section">
            <h3>How Many Players?</h3>
            <div class="player-buttons">
                <button class="player-btn" onclick="setPlayers(2)">2</button>
                <button class="player-btn" onclick="setPlayers(3)">3</button>
                <button class="player-btn" onclick="setPlayers(4)">4</button>
                <button class="player-btn" onclick="setPlayers(5)">5</button>
                <button class="player-btn" onclick="setPlayers(6)">6</button>
                <button class="player-btn" onclick="setPlayers(7)">7</button>
                <button class="player-btn" onclick="setPlayers(8)">8</button>
                <button class="player-btn" onclick="setPlayers(9)">9</button>
                <button class="player-btn" onclick="setPlayers(10)">10</button>
            </div>
        </div>

        <div class="setup-section">
            <h3>Win Goal?</h3>
            <button class="goal-btn" onclick="setGoal(1000000)">$1,000,000</button>
            <button class="goal-btn" onclick="setGoal(5000000)">$5,000,000</button>
        </div>

        <button id="setupDoneBtn" class="btn hidden" onclick="setupPlayers()">
            NEXT - Setup Players
        </button>
    </div>

    <!-- PLAYER SETUP SCREEN -->
    <div id="playerSetupScreen" class="screen hidden">
        <h1>⚡ CHAOS ⚡</h1>
        <h2 id="playerSetupTitle">Player 1 Setup</h2>

        <div class="setup-section">
            <h3>Choose Your Avatar!!</h3>
            <div class="avatar-grid">
                <button class="avatar-btn" onclick="selectAvatar('👨')">👨</button>
                <button class="avatar-btn" onclick="selectAvatar('👩')">👩</button>
                <button class="avatar-btn" onclick="selectAvatar('👦')">👦</button>
                <button class="avatar-btn" onclick="selectAvatar('👧')">👧</button>
                <button class="avatar-btn" onclick="selectAvatar('👴')">👴</button>
                <button class="avatar-btn" onclick="selectAvatar('👵')">👵</button>
                <button class="avatar-btn" onclick="selectAvatar('🧔')">🧔</button>
                <button class="avatar-btn" onclick="selectAvatar('👱')">👱</button>
                <button class="avatar-btn" onclick="selectAvatar('🧕')">🧕</button>
                <button class="avatar-btn" onclick="selectAvatar('👮')">👮</button>
            </div>
        </div>

        <div class="setup-section">
            <h3>Enter Your Name!!</h3>
            <input type="text" id="playerName" class="name-input" placeholder="Enter your name"/>
        </div>

        <button id="nextPlayerBtn" class="btn" onclick="nextPlayer()">
            NEXT PLAYER
        </button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="screen hidden">
        <h1>⚡ CHAOS ⚡</h1>
        <div id="playerInfoBar" class="player-info-bar"></div>
        <div id="gameBoard" class="game-board"></div>
        <div class="game-controls">
            <div id="currentPlayerInfo" class="current-player-info"></div>
            <button id="rollDiceBtn" class="btn dice-btn" onclick="rollDice()">
                🎲 ROLL DICE
            </button>
            <div id="diceResult" class="dice-result"></div>
            <div id="gameMessage" class="game-message"></div>
        </div>
    </div>

    <!-- POPUP/MODAL -->
    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <h2 id="popupTitle"></h2>
            <p id="popupMessage"></p>
            <button class="btn" onclick="closePopup()">OK!!</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
